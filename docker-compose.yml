services:
  db:
    image: pgvector/pgvector:pg16
    container_name: saea_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - saea_network

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: saea_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - saea_network

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: saea_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - saea_network

networks:
  saea_network:
    driver: bridge

volumes:
  pgdata:
